<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcha & Hello Kitty Space 🍵🎀</title>
  
  <!-- Police arrondie et moderne (Fredoka & Nunito) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bouton Musique Matcha -->
  <button class="audio-btn" id="audioBtn">
    <span class="btn-icon">🍵</span>
    <span>Lofi & Matcha</span>
  </button>

  <main class="app-container">
    
    <!-- En-tête Hello Kitty & Matcha -->
    <header class="profile-header">
      <div class="avatar-wrapper">
        <!-- Illustration Hello Kitty avec Matcha -->
        <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f375.svg" alt="Matcha" class="matcha-badge">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/05/Hello_kitty_character_art.png" alt="Hello Kitty" class="hk-avatar">
      </div>
      <h1 class="main-title">Notre Espace Matcha 🍵</h1>
      <p class="tagline">Pour ma personne préférée 🎀</p>
    </header>

    <!-- Carte 1 : Générateur de Mots Doux -->
    <section class="hk-card">
      <div class="card-ribbon">🎀</div>
      <h2 class="card-title">Le Mot Doux du Jour</h2>
      
      <div class="note-box" id="noteDisplay">
        <p class="note-text">« Un petit instant douceur... Clique ci-dessous pour piocher ta pensée. »</p>
      </div>

      <button class="btn-hk" id="newNoteBtn">
        <span>Piocher une pensée</span>
        <span class="btn-emoji">✨</span>
      </button>
    </section>

    <!-- Carte 2 : Bucket List Matcha & Couple -->
    <section class="hk-card">
      <div class="card-ribbon">🍵</div>
      <h2 class="card-title">Projets & Dates à Cocher</h2>
      <p class="card-subtitle">Nos prochains petits moments ensemble :</p>

      <ul class="bucket-list">
        <li class="bucket-item">
          <input type="checkbox" id="task1">
          <label for="task1">
            <span class="custom-check"></span>
            Se faire un vrai Matcha Latte maison bien crémeux 🍵
          </label>
        </li>
        <li class="bucket-item">
          <input type="checkbox" id="task2">
          <label for="task2">
            <span class="custom-check"></span>
            Session shopping / dénicher un truc Hello Kitty 🎀
          </label>
        </li>
        <li class="bucket-item">
          <input type="checkbox" id="task3">
          <label for="task3">
            <span class="custom-check"></span>
            Soirée chill, plaid et série/film réconfortant 🍕
          </label>
        </li>
        <li class="bucket-item">
          <input type="checkbox" id="task4">
          <label for="task4">
            <span class="custom-check"></span>
            Tester un nouveau salon de thé / café sympa 🍰
          </label>
        </li>
      </ul>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
